[project]
name = "edutrack-api"
version = "2.0.0"
description = "FastAPI + PostgreSQL 16 REST API server for the Gheras EduTrack system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edutrack_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
