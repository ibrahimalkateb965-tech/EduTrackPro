services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gheras_edutrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../db/postgres:/docker-entrypoint-initdb.d:ro
      - gheras_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gheras_edutrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -q uv && uv sync --frozen --no-dev && uv run uvicorn edutrack_api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gheras_edutrack
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  gheras_pgdata:
