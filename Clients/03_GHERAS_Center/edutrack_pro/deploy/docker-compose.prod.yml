# EduTrack Pro — production stack for the Hostinger VPS.
# Run through deploy/deploy.sh (it owns .env generation, role passwords,
# the admin seed and the Caddy site). Manual use:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: edutrack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gheras_edutrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Riyadh
    volumes:
      # 001 -> 002 -> 003 run in name order on the first start of an empty volume.
      - ../db/postgres:/docker-entrypoint-initdb.d:ro
      - gheras_pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: the entrypoint's temporary init server listens on the unix socket only,
      # so this stays unhealthy until initdb scripts (001->003) have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d gheras_edutrack"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No `ports:` — PostgreSQL is reachable only on the compose network.

  api:
    build: ../server
    image: edutrack-api:2
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gheras_app:${GHERAS_APP_PASSWORD:?set in deploy/.env}@db:5432/gheras_edutrack
      TZ: Asia/Riyadh
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; the host Caddy proxies /api/*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Fallback edge only when the VPS has no host Caddy: `--profile edge`.
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.rendered:/etc/caddy/Caddyfile:ro
      - ../web:/opt/edutrack/web:ro
      - ../assets:/opt/edutrack/assets:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  gheras_pgdata:
  caddy_data:
  caddy_config:
