<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شهادة مركز غراس</title>
<link rel="stylesheet" href="../print.css">
</head>
<body class="page-a4-landscape">
<div class="sheet">
  <div class="cert-frame">
    <div class="cert-inner">
      <header class="doc-header">
        <img class="doc-logo" src="../gheras_logo.png" alt="مركز غراس">
        <div class="doc-header-center">
          <div class="doc-center-name">مركز غراس</div>
          <div class="doc-tagline">من غراس تبدأ المعرفة وتصنع القمة</div>
          <div class="doc-title">{{title}}</div>
        </div>
        <div class="doc-meta">
          <div class="meta-row"><span class="meta-label">الرقم:</span> {{certificate_no}}</div>
          <div class="meta-row"><span class="meta-label">التاريخ:</span> {{date}}</div>
        </div>
      </header>

      <main class="cert-body">
        <p class="cert-intro">تتقدم إدارة مركز غراس بأسمى آيات الشكر والتقدير إلى الطالب/الطالبة</p>
        <div class="cert-name">{{student_name}}</div>
        <p class="cert-reason">{{reason}}</p>
        <p class="cert-closing">مع أطيب التمنيات بمزيد من التفوق والنجاح</p>
      </main>

      <div class="signatures">
        <div class="cert-date">التاريخ: {{date}}</div>
        <div class="signature">
          <div class="sig-line"></div>
          <div class="sig-name">مدير المركز</div>
        </div>
      </div>

      <footer class="doc-footer">
        <span>حوطة بني تميم</span>
        <span>صفحة 1 من 1</span>
      </footer>
    </div>
  </div>
</div>
<script type="module" src="../print_engine.js"></script>
</body>
</html>
