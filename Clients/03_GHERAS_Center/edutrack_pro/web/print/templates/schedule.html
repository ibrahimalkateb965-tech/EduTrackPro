<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الجدول الأسبوعي</title>
<link rel="stylesheet" href="../print.css">
</head>
<body class="page-a4-landscape">
<div class="sheet">
  <header class="doc-header">
    <img class="doc-logo" src="../gheras_logo.png" alt="مركز غراس">
    <div class="doc-header-center">
      <div class="doc-center-name">مركز غراس</div>
      <div class="doc-tagline">من غراس تبدأ المعرفة وتصنع القمة</div>
      <div class="doc-title">الجدول الأسبوعي</div>
    </div>
    <div class="doc-meta">
      <div class="meta-row"><span class="meta-label">القاعة:</span> {{room}}</div>
      <div class="meta-row"><span class="meta-label">المجموعة:</span> {{group}}</div>
    </div>
  </header>

  <main class="doc-body">
    <table>
      <thead>
        <tr>
          <th scope="col">الوقت</th>
          <th scope="col">الأحد</th>
          <th scope="col">الاثنين</th>
          <th scope="col">الثلاثاء</th>
          <th scope="col">الأربعاء</th>
          <th scope="col">الخميس</th>
        </tr>
      </thead>
      <tbody>
      {{#periods}}
        <tr>
          <th scope="row">{{start_time}} - {{end_time}}</th>
          <td>{{sun}}</td>
          <td>{{mon}}</td>
          <td>{{tue}}</td>
          <td>{{wed}}</td>
          <td>{{thu}}</td>
        </tr>
      {{/periods}}
      </tbody>
    </table>
  </main>

  <footer class="doc-footer">
    <span>حوطة بني تميم</span>
    <span>صفحة 1 من 1</span>
  </footer>
</div>
</body>
</html>
